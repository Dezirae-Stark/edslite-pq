name: Build QubesDroid-PQ APK

on:
  push:
    branches: [ qubesdroid-dev, master ]
  pull_request:
    branches: [ qubesdroid-dev, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        echo "y" | sdkmanager "ndk;21.4.7075529"
        echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> local.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create keystore for signing (debug)
      run: |
        mkdir -p misc
        if [ ! -f misc/keys.keystore ]; then
          keytool -genkey -v -keystore misc/keys.keystore -alias eds-debug-key -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug,OU=Dev,O=QubesDroid,L=City,S=State,C=US"
        else
          echo "Keystore already exists, skipping creation"
        fi

    - name: Make Gradlew executable
      run: chmod +x gradlew

    - name: Build Lite Debug APK
      run: ./gradlew assembleLiteNoinetNofsmlDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qubesdroid-pq-lite-debug
        path: app/build/outputs/apk/liteNoinetNofsml/debug/*.apk
        retention-days: 30

    - name: Build Summary
      run: |
        echo "## Build Successful! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### QubesDroid-PQ APK Built" >> $GITHUB_STEP_SUMMARY
        echo "- **Format:** Pure Post-Quantum (ML-KEM-1024 + ChaCha20-Poly1305)" >> $GITHUB_STEP_SUMMARY
        echo "- **Variant:** Lite + No Internet + No FSM + Debug" >> $GITHUB_STEP_SUMMARY
        echo "- **Native Libraries:** qubesdroid-crypto compiled for ARM64/ARMv7" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the APK from the **Artifacts** section above!" >> $GITHUB_STEP_SUMMARY
